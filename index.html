<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSOC — Edo State Strategic Security Operations Centre</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px; /* Reduced from 30px to make header shorter */
            text-align: center;
            position: fixed; /* Fixes header at top */
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000; /* Ensures it stays on top */
        }
        .main-title {
            font-size: 28px; /* Slightly smaller for compact header */
            font-weight: bold;
            margin: 0;
        }
        .subtitle {
            font-size: 16px; /* Smaller subtitle */
            font-style: italic;
            margin: 8px 0 0;
            opacity: 0.9;
        }
        .iframe-container {
            margin-top: 150px; /* Space exactly for the shorter header (approx measured height) */
            height: calc(100vh - 10px);
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="main-title">ESSOC — Edo State Strategic Security Operations Centre</h1>
        <p class="subtitle">Powered by EdoSafe Security Intelligence Grid</p>
    </header>

    <div class="iframe-container">
        <iframe src="https://app.tracki.com/map" allowfullscreen></iframe>
    </div>
</body>
</html>
