<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSOC — Edo State Strategic Security Operations Centre</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .main-title {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }
        .subtitle {
            font-size: 18px;
            font-style: italic;
            margin: 10px 0 0;
            opacity: 0.9;
        }
        .iframe-container {
            width: 100%;
            height: calc(100vh - 140px); /* Matches header height */
            overflow: hidden; /* Prevents outer scroll */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            padding-top: 60px; /* Key fix: Pushes Tracki content down to clear any overlap */
            box-sizing: border-box;
            overflow: auto; /* Allows scrolling inside iframe if needed */
        }
    </style>
</head>
<body>
    <header>
        <h1 class="main-title">ESSOC — Edo State Strategic Security Operations Centre</h1>
        <p class="subtitle">Powered by EdoSafe Security Intelligence Grid</p>
    </header>

    <div class="iframe-container">
        <iframe src="https://app.tracki.com/map" allowfullscreen></iframe>
    </div>
</body>
</html>
